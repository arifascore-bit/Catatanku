<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatanku</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF6B9D">
  <style>
    body { font-family: 'Segoe UI'; background: linear-gradient(135deg, #fff0f5, #ffe4ec); padding: 20px; text-align: center; min-height: 100vh; }
    h1 { color: #FF6B9D; }
    .box { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
    input { padding: 12px; width: 70%; border-radius: 10px; border: 2px solid #FF6B9D; font-size: 16px; }
    button { padding: 12px 20px; border-radius: 10px; border: none; background: #FF6B9D; color: white; cursor: pointer; font-weight: bold; }
    #catatan { margin-top: 20px; text-align: left; max-width: 500px; margin: 20px auto; }
    .item { background: white; padding: 12px; margin: 8px 0; border-radius: 10px; display: flex; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .hapus-btn { background: #ff4d6d; padding: 6px 12px; font-size: 14px; border: none; color: white; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>💖 Catatanku 💖</h1>
  <div class="box">
    <input type="text" id="inputCatatan" placeholder="Tulis catatan...">
    <button onclick="tambahCatatan()">Simpan</button>
  </div>
  <div id="catatan"></div>

  <script>
    let db;
    // Buka database
    let request = indexedDB.open("CatatanDB", 1);
    request.onupgradeneeded = e => {
      db = e.target.result;
      db.createObjectStore("catatan", {keyPath: "id", autoIncrement: true});
    };
    request.onsuccess = e => { db = e.target.result; tampilkanCatatan(); }

    function tampilkanCatatan() {
      let tx = db.transaction("catatan", "readonly");
      let store = tx.objectStore("catatan");
      let req = store.getAll();
      req.onsuccess = () => {
        let data = req.result;
        if(data.length === 0) {
          document.getElementById('catatan').innerHTML = '<p style="color:gray;">Belum ada catatan</p>';
          return;
        }
        document.getElementById('catatan').innerHTML = data.map(c => 
          `<div class="item">${c.teks} <button class="hapus-btn" onclick="hapus(${c.id})">Hapus</button></div>`
        ).join('');
      }
    }

    function tambahCatatan() {
      let input = document.getElementById('inputCatatan');
      if(input.value.trim() === '') return alert('Isi dulu catatannya! 💌');
      let tx = db.transaction("catatan", "readwrite");
      let store = tx.objectStore("catatan");
      store.add({teks: input.value});
      tx.oncomplete = () => { input.value = ''; tampilkanCatatan(); }
    }

    function hapus(id) {
      let tx = db.transaction("catatan", "readwrite");
      let store = tx.objectStore("catatan");
      store.delete(id);
      tx.oncomplete = () => tampilkanCatatan();
    }

    if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
