<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catatanku</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF6B9D">
  <style>
    body { 
      font-family: 'Segoe UI', Arial; 
      background: linear-gradient(135deg, #fff0f5, #ffe4ec); 
      padding: 20px; 
      text-align: center; 
      min-height: 100vh;
    }
    h1 { color: #FF6B9D; }
    .box { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
    input { 
      padding: 12px; 
      width: 70%; 
      border-radius: 10px; 
      border: 2px solid #FF6B9D; 
      font-size: 16px;
    }
    button { 
      padding: 12px 20px; 
      border-radius: 10px; 
      border: none; 
      background: #FF6B9D; 
      color: white; 
      cursor: pointer; 
      font-weight: bold;
    }
    button:hover { background: #e05588; }
    #catatan { margin-top: 20px; text-align: left; max-width: 500px; margin: 20px auto; }
    .item { 
      background: white; 
      padding: 12px; 
      margin: 8px 0; 
      border-radius: 10px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .hapus-btn { background: #ff4d6d; padding: 6px 12px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>💖 Catatanku 💖</h1>
  <div class="box">
    <input type="text" id="inputCatatan" placeholder="Tulis catatan...">
    <button onclick="tambahCatatan()">Simpan</button>
  </div>
  <div id="catatan"></div>

  <script>
    // Muat data dari localStorage
    function tampilkanCatatan() {
      let data = JSON.parse(localStorage.getItem('catatan')) || [];
      if(data.length === 0) {
        document.getElementById('catatan').innerHTML = '<p style="color:gray;">Belum ada catatan</p>';
        return;
      }
      document.getElementById('catatan').innerHTML = data.map((c,i) => 
        `<div class="item">${c} <button class="hapus-btn" onclick="hapus(${i})">Hapus</button></div>`
      ).join('');
    }

    // Tambah catatan baru
    function tambahCatatan() {
      let input = document.getElementById('inputCatatan');
      if(input.value.trim() === '') return alert('Isi dulu catatannya! 💌');
      
      let data = JSON.parse(localStorage.getItem('catatan')) || [];
      data.push(input.value);
      localStorage.setItem('catatan', JSON.stringify(data));
      input.value = '';
      tampilkanCatatan();
    }

    // Hapus catatan
    function hapus(i) {
      let data = JSON.parse(localStorage.getItem('catatan')) || [];
      data.splice(i,1);
      localStorage.setItem('catatan', JSON.stringify(data));
      tampilkanCatatan();
    }

    // Daftarin service worker biar bisa offline
    if('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      })
    }

    // Jalanin pas pertama buka
    tampilkanCatatan();
  </script>
</body>
</html>
